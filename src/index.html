<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="icon" href="../Resources/View/favicon.ico" type="image/x-icon">
    <title>Witryna projektów</title>

    <!-- PWA (manifest dokładany dynamicznie tylko na zakładce Kilometrówka - patrz MileagePage) -->
    <meta name="theme-color" content="#6cb33f">
    <link rel="apple-touch-icon" href="pwa/apple-touch-icon-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="ENVI">
</head>

<body>
    <div id="root"></div>
    <script src="bundle.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('sw.js').catch(function (e) {
                    console.error('SW registration failed', e);
                });
            });
        }
    </script>
</body>

</html>
